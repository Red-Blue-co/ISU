# Builds the site on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves at isu.sherin.fun
name: Deploy ISU to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages has no server routing: serve the app for unknown paths so /about, /community and /login load directly
      - run: cp dist/index.html dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: isu.sherin.fun
          user_name: Sherin Varghese
          user_email: sherinv.de@gmail.com
          commit_message: Publish
